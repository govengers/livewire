name: CI

on:
  push:
    branches: [main, feat/v1]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go-library:
    uses: govengers/.github/.github/workflows/go-library.yml@v1
    with:
      bun-version: "1.4.2" # the TypeScript gates (just test-typescript, the e2e suite's runtime, the example's type check)
    permissions:
      contents: write # the badges job pushes test and coverage badges to the badges branch
